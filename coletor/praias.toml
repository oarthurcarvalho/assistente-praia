# As 8 praias do projeto. Uma praia nova é só uma tabela nova aqui, sem mudar código.
#
# lat, lon      ponto no mar, ~1 km da areia: é ele que escolhe a célula do modelo de onda.
#               8 praias caem em 5 células de ~9 km (medido em 19/11/2026):
#               Arpoador, Ipanema e Leblon são a mesma; Prainha e Grumari também.
# orientacao    para onde a praia "olha", em graus a partir do norte (sul = 180).
#               Normal à linha de costa do OpenStreetMap perto do ponto do INEA,
#               arredondada a 5 graus. Arpoador e Grumari: conferir no mapa.
# inea          código do ponto de coleta no SEIRHI (no boletim em PDF é a sigla final,
#               ex.: 02RJ01CP0005 = CP05).

[copacabana]
nome = "Copacabana"
lat = -23.010
lon = -43.160
orientacao = 135
inea = "02RJ01CP0005" # em frente à Rua Santa Clara

[arpoador]
nome = "Arpoador"
lat = -22.995
lon = -43.192
